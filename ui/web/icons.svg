<?xml version="1.0" encoding="UTF-8"?>
<!-- Set de iconos de la interfaz. Se dibujan con trazo (heredan el color del
     texto) y se usan con <svg class="ic"><use href="/static/icons.svg#i-nombre"/></svg>.
     Para agregar uno: un <symbol id="i-nombre" viewBox="0 0 24 24"> con trazos. -->
<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Marca y navegacion -->
  <symbol id="i-logo" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M8.2 7h7.6M7.2 8.9l3.7 7.2M16.8 8.9l-3.7 7.2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-sim" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="19" r="2"/><path d="M7 6h10M6 7.8l5 9.4M18 7.8l-5 9.4"/><path d="M10.2 11.2l3.6 1.6" stroke-dasharray="1 2.4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>

