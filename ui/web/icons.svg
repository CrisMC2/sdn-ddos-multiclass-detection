  <symbol id="i-udp" viewBox="0 0 24 24"><path d="M3 6h9M3 12h18M3 18h9M16 4.5l4.5 4.5M16 15l4.5 4.5"/></symbol>
  <symbol id="i-ack" viewBox="0 0 24 24"><path d="M3.5 12.5l4.5 4.5L17 7M10 17l1.2 1.2L21 8"/></symbol>
  <symbol id="i-post" viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></symbol>
  <symbol id="i-multi" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></symbol>
  <symbol id="i-generic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
