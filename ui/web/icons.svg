  <symbol id="i-syn" viewBox="0 0 24 24"><path d="M2.5 7.5l3.5 3.5 3.5-3.5 3.5 3.5 3.5-3.5 3.5 3.5M2.5 15.5l3.5 3.5 3.5-3.5 3.5 3.5 3.5-3.5 3.5 3.5"/></symbol>
  <symbol id="i-http" viewBox="0 0 24 24"><path d="M12 3.5l9 4.8-9 4.8-9-4.8z"/><path d="M3 12.7l9 4.8 9-4.8M3 17l9 4.8 9-4.8"/></symbol>
